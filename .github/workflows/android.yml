name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lwip-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify native source and ELF checker contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_lwip_native.py'
      - name: Verify fuzz seeds, entry point, CPU accounting and replay contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_lwip_fuzz*.py'
      - name: Native frame tests with ASan, UBSan and lwIP pool guards
        run: bash scripts/test_lwip_host.sh --sanitize
      - name: Run seeded sanitizer smoke for all native fuzz targets
        run: |
          for target in ethernet commands lifecycle; do
            bash scripts/fuzz_lwip.sh --target "$target" \
              --output "build/lwip-fuzz/$target" --runs 100 --seed 7
          done
      - name: Native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-host-reports
          path: |
            build/lwip-host-linux/ctest.log
            build/lwip-host-linux/Testing/
      - name: Fuzz smoke corpus, logs and build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-fuzz-smoke
          if-no-files-found: warn
          path: |
            build/lwip-fuzz/*/compiler-version.txt
            build/lwip-fuzz/*/cmake-version.txt
            build/lwip-fuzz/*/configure.log
            build/lwip-fuzz/*/build.log
            build/lwip-fuzz/*/build-metadata.json
            build/lwip-fuzz/*/corpus/
            build/lwip-fuzz/*/campaign-*/report.json
            build/lwip-fuzz/*/campaign-*/batch-*.log
            build/lwip-fuzz/*/campaign-*/crashes/
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Verify pinned lwIP and four-ABI APK packaging
        run: python3 scripts/check_lwip_native.py --apk mobile/build/outputs/apk/debug/mobile-debug.apk
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
